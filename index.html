<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitrare Video RO</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 12px 16px; background: #1a1a1a; border-bottom: 1px solid #333; }
  h1 { margin: 0; font-size: 18px; }
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
  input[type="file"] { color: #aaa; }
  button, select, input[type="color"], input[type="number"], input[type="text"] {
    padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff;
  }
  button { cursor: pointer; background: #e2c14a; color: #111; font-weight: 600; border: none; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .subtitle-preview { position: relative; margin-top: 8px; }
  .subtitle-overlay {
    position: absolute; bottom: 12%; left: 0; right: 0;
    text-align: center; pointer-events: none; padding: 0 20px;
    text-shadow: 0 0 4px #000, 0 0 8px #000; line-height: 1.3;
  }
  .editor { margin-top: 16px; }
  .editor textarea {
    width: 100%; height: 180px; background: #1a1a1a; color: #eee;
    border: 1px solid #444; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 14px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
  .row label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .status { margin-top: 10px; font-size: 14px; color: #aaa; min-height: 20px; }
</style>
</head>
<body>
<header>
  <h1>Subtitrare Video — Română (Auto)</h1>
</header>

<div class="container">
  <div class="controls">
    <input type="file" id="fileInput" accept="video/*">
    <button id="btnTranscribe">Transcrie automat (RO)</button>
    <button id="btnLoadDemo">Încarcă exemplu</button>
  </div>

  <div class="subtitle-preview">
    <video id="video" controls playsinline></video>
    <div id="subtitleOverlay" class="subtitle-overlay"></div>
  </div>

  <div class="row">
    <label>Culoare text <input type="color" id="textColor" value="#ffffff"></label>
    <label>Culoare fundal <input type="color" id="bgColor" value="#000000"></label>
    <label>Transparență <input type="range" id="bgOpacity" min="0" max="100" value="40"></label>
    <label>Mărime <input type="number" id="fontSize" value="28" min="14" max="72" style="width:70px"></label>
    <label>Font
      <select id="fontFamily">
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Segoe UI', sans-serif">Segoe UI</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Courier New', monospace">Courier</option>
        <option value="Impact, sans-serif">Impact</option>
      </select>
    </label>
  </div>

  <div class="editor">
    <p style="margin:0 0 6px; font-size:14px;">Subtitrări (editează dacă e nevoie)</p>
    <textarea id="subtitleText" placeholder="Apasă „Transcrie automat” sau scrie manual:&#10;00:00:01.000 --> 00:00:04.000 | Text aici"></textarea>
  </div>

  <div class="controls" style="margin-top:12px">
    <button id="btnApply">Aplică stil & preview</button>
    <button id="btnDownloadSRT">Descarcă .SRT</button>
    <button id="btnExportVideo" disabled>Export video cu subtitrări</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('subtitleOverlay');
const fileInput = document.getElementById('fileInput');
const subtitleText = document.getElementById('subtitleText');
const textColor = document.getElementById('textColor');
const bgColor = document.getElementById('bgColor');
const bgOpacity = document.getElementById('bgOpacity');
const fontSize = document.getElementById('fontSize');
const fontFamily = document.getElementById('fontFamily');
const statusEl = document.getElementById('status');
const btnExport = document.getElementById('btnExportVideo');
const btnTranscribe = document.getElementById('btnTranscribe');

let cues = [];
let recognition = null;

function parseTime(t) {
  const parts = t.trim().split(':');
  if (parts.length === 3) {
    const [h, m, s] = parts;
    return parseFloat(h)*3600 + parseFloat(m)*60 + parseFloat(s);
  }
  return 0;
}

function parseSubtitles(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const result = [];
  for (const line of lines) {
    const match = line.match(/^(.+?)\s*-->\s*(.+?)\s*\|\s*(.+)$/);
    if (match) {
      result.push({
        start: parseTime(match[1]),
        end: parseTime(match[2]),
        text: match[3]
      });
    }
  }
  return result;
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = (seconds % 60).toFixed(3);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(6,'0')}`;
}

function applyStyle() {
  overlay.style.color = textColor.value;
  overlay.style.fontSize = fontSize.value + 'px';
  overlay.style.fontFamily = fontFamily.value;
  const op = bgOpacity.value / 100;
  const hex = bgColor.value;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  overlay.style.background = `rgba(${r},${g},${b},${op})`;
  overlay.style.padding = '6px 12px';
  overlay.style.borderRadius = '6px';
  overlay.style.display = 'inline-block';
  overlay.style.maxWidth = '90%';
}

function updateOverlay() {
  const t = video.currentTime;
  const cue = cues.find(c => t >= c.start && t <= c.end);
  overlay.textContent = cue ? cue.text : '';
  overlay.style.visibility = cue ? 'visible' : 'hidden';
}

fileInput.onchange = () => {
  const file = fileInput.files[0];
  if (!file) return;
  video.src = URL.createObjectURL(file);
  btnExport.disabled = false;
  statusEl.textContent = 'Video încărcat. Poți încerca „Transcrie automat (RO)”.';
};

document.getElementById('btnLoadDemo').onclick = () => {
  subtitleText.value = `00:00:01.000 --> 00:00:04.000 | Bună! Acesta este un exemplu.
00:00:04.500 --> 00:00:08.000 | Poți edita textul, culoarea și mărimea.`;
  applyAndPreview();
};

function applyAndPreview() {
  cues = parseSubtitles(subtitleText.value);
  applyStyle();
  statusEl.textContent = cues.length ? `Am găsit ${cues.length} subtitrări.` : 'Nicio subtitrare validă.';
}

document.getElementById('btnApply').onclick = applyAndPreview;

video.ontimeupdate = updateOverlay;
video.onseeked = updateOverlay;

// === Transcriere automată (Web Speech API - română) ===
btnTranscribe.onclick = async () => {
  if (!video.src) {
    statusEl.textContent = 'Încarcă mai întâi un video.';
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusEl.textContent = 'Browserul tău nu suportă recunoaștere vocală. Folosește Chrome pe desktop.';
    return;
  }

  statusEl.textContent = 'Se pregătește transcrierea... Pornește video-ul și vorbește clar (sau lasă audio-ul din clip).';
  btnTranscribe.disabled = true;

  recognition = new SpeechRecognition();
  recognition.lang = 'ro-RO';
  recognition.continuous = true;
  recognition.interimResults = false;

  let collected = [];
  let startTime = 0;

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        const text = event.results[i][0].transcript.trim();
        if (text) {
          const now = video.currentTime;
          const duration = Math.max(2, text.length * 0.12); // estimare durată
          collected.push({
            start: Math.max(0, now - duration),
            end: now,
            text
          });
        }
      }
    }
  };

  recognition.onerror = (e) => {
    statusEl.textContent = 'Eroare recunoaștere: ' + e.error;
    btnTranscribe.disabled = false;
  };

  recognition.onend = () => {
    if (collected.length) {
      const lines = collected.map(c => 
        `${formatTime(c.start)} --> ${formatTime(c.end)} | ${c.text}`
      );
      subtitleText.value = lines.join('\n');
      applyAndPreview();
      statusEl.textContent = `Transcriere gata: ${collected.length} fragmente. Editează dacă e nevoie.`;
    } else {
      statusEl.textContent = 'Nu s-a detectat vorbire. Încearcă din nou sau scrie manual.';
    }
    btnTranscribe.disabled = false;
  };

  // Pornește recunoașterea și video-ul
  video.currentTime = 0;
  video.play();
  recognition.start();

  // Oprește automat când video-ul se termină
  video.onended = () => {
    recognition.stop();
  };
};

// Descărcare SRT
document.getElementById('btnDownloadSRT').onclick = () => {
  if (!cues.length) applyAndPreview();
  if (!cues.length) return;
  let srt = '';
  cues.forEach((c, i) => {
    srt += `${i+1}\n`;
    srt += `${formatTime(c.start).replace('.',',')} --> ${formatTime(c.end).replace('.',',')}\n`;
    srt += `${c.text}\n\n`;
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([srt], { type: 'text/srt' }));
  a.download = 'subtitrari_ro.srt';
  a.click();
  statusEl.textContent = 'Fișier SRT descărcat.';
};

// Export video (simplificat)
document.getElementById('btnExportVideo').onclick = async () => {
  if (!video.src || !cues.length) {
    statusEl.textContent = 'Încarcă video + subtitrări mai întâi.';
    return;
  }
  statusEl.textContent = 'Export în curs... (poate dura)';
  btnExport.disabled = true;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  const stream = canvas.captureStream(30);

  const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  const chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);

  video.currentTime = 0;
  await new Promise(r => video.onseeked = r);
  recorder.start();
  video.play();

  function draw() {
    if (video.paused || video.ended) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const cue = cues.find(c => video.currentTime >= c.start && video.currentTime <= c.end);
    if (cue) {
      ctx.font = `${fontSize.value}px ${fontFamily.value}`;
      ctx.textAlign = 'center';
      const op = bgOpacity.value / 100;
      const hex = bgColor.value;
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      ctx.fillStyle = `rgba(${r},${g},${b},${op})`;
      const w = ctx.measureText(cue.text).width;
      const y = canvas.height * 0.85;
      ctx.fillRect(canvas.width/2 - w/2 - 16, y - fontSize.value, w + 32, fontSize.value + 16);
      ctx.fillStyle = textColor.value;
      ctx.fillText(cue.text, canvas.width/2, y);
    }
    requestAnimationFrame(draw);
  }
  draw();

  video.onended = () => recorder.stop();
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'video_subtitrat.webm';
    a.click();
    statusEl.textContent = 'Export gata!';
    btnExport.disabled = false;
  };
};

applyStyle();
</script>
</body>
</html>
