<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitrare Video RO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Poppins:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 12px 16px; background: #1a1a1a; border-bottom: 1px solid #333; }
  h1 { margin: 0; font-size: 18px; }
  .container { max-width: 1000px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
  @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
  .stage { position: relative; display: table; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
  video { display: block; max-width: 100%; max-height: 70vh; width: auto; background: #000; }
  .subtitle-overlay { position: absolute; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; padding: 0 6%; }
  .subtitle-overlay span.box { display: inline-block; text-align: center; line-height: 1.25; padding: .25em .5em; border-radius: .25em; }
  .subtitle-overlay .w { white-space: pre-wrap; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; align-items: center; }
  input[type="file"] { color: #aaa; max-width: 100%; }
  button, select, input[type="color"], input[type="number"] { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
  input[type="color"] { padding: 2px; height: 34px; width: 44px; }
  button { cursor: pointer; background: #e2c14a; color: #111; font-weight: 600; border: none; }
  button.sec { background: #2c2c2c; color: #eee; border: 1px solid #444; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  .row label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  h3 { margin: 14px 0 4px; font-size: 14px; color: #e2c14a; }
  textarea { width: 100%; height: 300px; background: #1a1a1a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 13px; }
  .status { margin-top: 8px; font-size: 14px; color: #aaa; min-height: 20px; }
  progress { width: 100%; height: 8px; display: none; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header><h1>Subtitrare Video — Română (Whisper în browser)</h1></header>

<div class="container">
  <div>
    <div class="stage"><video id="video" controls playsinline></video>
      <div class="subtitle-overlay" id="overlay"><span class="box" id="box" style="visibility:hidden"></span></div>
    </div>
    <div class="status" id="status"></div>
    <progress id="progress" max="100" value="0"></progress>
  </div>

  <div>
    <div class="controls">
      <input type="file" id="fileInput" accept="video/*,audio/*">
    </div>
    <div class="controls">
      <select id="model">
        <option value="Xenova/whisper-base">Whisper base (rapid)</option>
        <option value="Xenova/whisper-small" selected>Whisper small (precis)</option>
      </select>
      <button id="btnTranscribe" disabled>Transcrie automat (RO)</button>
    </div>

    <h3>Lungime subtitrare</h3>
    <div class="row">
      <label>Caractere / subtitrare <input type="range" id="maxChars" min="8" max="60" value="20"> <b id="maxCharsVal">20</b></label>
    </div>

    <h3>Stil</h3>
    <div class="presets">
      <button class="sec" data-preset="default">Default</button>
      <button class="sec" data-preset="pop">Pop Art</button>
      <button class="sec" data-preset="clean">Clean</button>
      <button class="sec" data-preset="classic">Clasic</button>
    </div>
    <div class="row">
      <label>Text <input type="color" id="textColor" value="#ffffff"></label>
      <label>Cuvânt activ <input type="color" id="hiColor" value="#19d3e6"></label>
      <label>Fundal <input type="color" id="bgColor" value="#000000"></label>
      <label>Opacitate <input type="range" id="bgOpacity" min="0" max="100" value="70"></label>
    </div>
    <div class="row">
      <label>Mărime % <input type="number" id="fontSize" value="6" min="2" max="15" step="0.5" style="width:70px"></label>
      <label>Poziție % de jos <input type="range" id="pos" min="3" max="90" value="30"></label>
      <label>Font
        <select id="fontFamily">
          <option value="Montserrat, Arial, sans-serif">Montserrat</option>
          <option value="Poppins, Arial, sans-serif">Poppins</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="Impact, sans-serif">Impact</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="hiOn" checked> Evidențiază cuvântul</label>
      <label><input type="checkbox" id="upper" checked> MAJUSCULE</label>
      <label><input type="checkbox" id="bold" checked> Bold</label>
      <label><input type="checkbox" id="outline"> Contur</label>
    </div>

    <h3>Subtitrări (SRT, editabile)</h3>
    <textarea id="subtitleText" spellcheck="false"></textarea>
    <div class="controls">
      <button id="btnApply">Aplică editările</button>
      <button id="btnDownloadSRT" class="sec">Descarcă .SRT</button>
      <button id="btnDemo" class="sec">Exemplu</button>
    </div>
    <div class="controls">
      <label style="font-size:13px">Încarcă .srt/.vtt: <input type="file" id="srtInput" accept=".srt,.vtt,.txt"></label>
    </div>
    <div class="controls">
      <button id="btnExport" disabled>Export video cu subtitrări (.webm)</button>
    </div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const video = $('video'), box = $('box'), overlay = $('overlay'), fileInput = $('fileInput');
const subtitleText = $('subtitleText'), statusEl = $('status');
const btnTranscribe = $('btnTranscribe'), btnExport = $('btnExport'), progress = $('progress');
const textColor = $('textColor'), hiColor = $('hiColor'), bgColor = $('bgColor'), bgOpacity = $('bgOpacity');
const fontSize = $('fontSize'), fontFamily = $('fontFamily'), pos = $('pos');
const hiOn = $('hiOn'), upper = $('upper'), bold = $('bold'), outline = $('outline');
const maxChars = $('maxChars');

let cues = [];        // {start,end,text,words:[{w,s,e}]}
let baseWords = [];   // [{w,s,e}] pentru regrupare
let currentFile = null, exporting = false;

/* ---------- timp ---------- */
function parseTime(t) {
  const p = t.trim().replace(',', '.').split(':').map(parseFloat);
  if (p.some(isNaN)) return 0;
  if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  if (p.length === 2) return p[0]*60 + p[1];
  return p[0] || 0;
}
function fmt(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60), ms = Math.round((sec%1)*1000);
  const p = (n, l=2) => String(n).padStart(l, '0');
  return `${p(h)}:${p(m)}:${p(s)},${p(ms,3)}`;
}

/* ---------- cuvinte cu timp (distribuție proporțională) ---------- */
function splitWords(text, start, end) {
  const ws = text.split(/\s+/).filter(Boolean);
  const total = ws.reduce((a, w) => a + w.length + 1, 0) || 1;
  let acc = 0;
  return ws.map(w => {
    const s = start + (acc / total) * (end - start);
    acc += w.length + 1;
    return { w, s, e: start + (acc / total) * (end - start) };
  });
}

/* ---------- parsare / serializare ---------- */
function parseSubtitles(text) {
  const out = [];
  text = text.replace(/\r/g, '').replace(/^WEBVTT.*\n/, '');
  const pipeRe = /^(.+?)\s*-->\s*(.+?)\s*\|\s*(.+)$/;
  for (const block of text.split(/\n\s*\n/)) {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    if (lines.length === 1 && pipeRe.test(lines[0])) continue;
    const idx = lines.findIndex(l => l.includes('-->'));
    if (idx === -1) continue;
    const m = lines[idx].match(/^(.+?)\s*-->\s*(\S+)/);
    const txt = lines.slice(idx + 1).join(' ');
    if (m && txt) out.push({ start: parseTime(m[1]), end: parseTime(m[2]), text: txt });
  }
  for (const line of text.split('\n')) {
    const m = line.trim().match(pipeRe);
    if (m) out.push({ start: parseTime(m[1]), end: parseTime(m[2]), text: m[3].trim() });
  }
  out.sort((a, b) => a.start - b.start);
  out.forEach(c => c.words = splitWords(c.text, c.start, c.end));
  return out;
}
function toSRT(list) {
  return list.map((c, i) => `${i+1}\n${fmt(c.start)} --> ${fmt(c.end)}\n${c.text}\n`).join('\n');
}

/* ---------- grupare după nr. de caractere ---------- */
function group(words, max) {
  const res = [];
  let cur = [];
  const len = a => a.map(x => x.w).join(' ').length;
  for (const w of words) {
    const gap = cur.length ? w.s - cur[cur.length-1].e : 0;
    if (cur.length && (len(cur) + 1 + w.w.length > max || gap > 0.9)) { res.push(cur); cur = []; }
    cur.push(w);
  }
  if (cur.length) res.push(cur);
  return res.map(g => ({
    start: g[0].s, end: g[g.length-1].e, text: g.map(x => x.w).join(' '), words: g
  }));
}
function regroup() {
  if (!baseWords.length) return;
  cues = group(baseWords, +maxChars.value);
  subtitleText.value = toSRT(cues);
  statusEl.textContent = `${cues.length} subtitrări.`;
  updateOverlay();
}
maxChars.addEventListener('input', () => { $('maxCharsVal').textContent = maxChars.value; regroup(); });

function setFromCues(list) {
  baseWords = list.flatMap(c => c.words);
  regroup();
}

/* ---------- stil ---------- */
const PRESETS = {
  default: { text:'#ffffff', hi:'#19d3e6', bg:'#000000', op:70, up:true, bold:true, out:false, font:'Montserrat, Arial, sans-serif', hion:true },
  pop:     { text:'#ffffff', hi:'#39ff14', bg:'#000000', op:0,  up:true, bold:true, out:true,  font:'Impact, sans-serif', hion:true },
  clean:   { text:'#ffffff', hi:'#ffd400', bg:'#000000', op:0,  up:false, bold:true, out:true, font:'Poppins, Arial, sans-serif', hion:true },
  classic: { text:'#ffffff', hi:'#ffffff', bg:'#000000', op:55, up:false, bold:false, out:false, font:'Arial, sans-serif', hion:false }
};
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const p = PRESETS[b.dataset.preset];
  textColor.value = p.text; hiColor.value = p.hi; bgColor.value = p.bg; bgOpacity.value = p.op;
  upper.checked = p.up; bold.checked = p.bold; outline.checked = p.out; hiOn.checked = p.hion;
  fontFamily.value = p.font;
  updateOverlay();
});
function rgba() {
  const h = bgColor.value;
  return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${bgOpacity.value/100})`;
}
const disp = w => upper.checked ? w.toUpperCase() : w;
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function activeIdx(cue, t) {
  let i = cue.words.findIndex(w => t >= w.s && t < w.e);
  return i === -1 ? (t >= cue.words[cue.words.length-1].e ? cue.words.length-1 : 0) : i;
}

function updateOverlay() {
  const W = video.clientWidth || 300;
  const fs = W * (parseFloat(fontSize.value) || 6) / 100;
  overlay.style.bottom = pos.value + '%';
  Object.assign(box.style, {
    fontSize: fs + 'px', fontFamily: fontFamily.value, fontWeight: bold.checked ? 800 : 500,
    background: rgba(), color: textColor.value,
    webkitTextStroke: outline.checked ? (fs * 0.08) + 'px #000' : '0',
    paintOrder: 'stroke fill'
  });
  const t = video.currentTime;
  const cue = cues.find(c => t >= c.start && t <= c.end);
  if (!cue || !cue.words.length) { box.style.visibility = 'hidden'; return; }
  const ai = activeIdx(cue, t);
  box.innerHTML = cue.words.map((w, i) =>
    `<span class="w" style="color:${hiOn.checked && i === ai ? hiColor.value : textColor.value}">${esc(disp(w.w))}${i < cue.words.length-1 ? ' ' : ''}</span>`
  ).join('');
  box.style.visibility = 'visible';
}
[textColor, hiColor, bgColor, bgOpacity, fontSize, fontFamily, pos, hiOn, upper, bold, outline]
  .forEach(el => el.addEventListener('input', updateOverlay));
video.addEventListener('timeupdate', updateOverlay);
video.addEventListener('seeked', updateOverlay);
video.addEventListener('loadedmetadata', updateOverlay);
window.addEventListener('resize', updateOverlay);
(function loop() { if (!video.paused) updateOverlay(); requestAnimationFrame(loop); })();

/* ---------- editări manuale / fișiere ---------- */
$('btnApply').onclick = () => {
  cues = parseSubtitles(subtitleText.value);
  baseWords = cues.flatMap(c => c.words);
  statusEl.textContent = cues.length ? `${cues.length} subtitrări valide.` : 'Nicio subtitrare validă.';
  updateOverlay();
};
fileInput.onchange = () => {
  const f = fileInput.files[0]; if (!f) return;
  currentFile = f;
  video.src = URL.createObjectURL(f);
  btnTranscribe.disabled = false; btnExport.disabled = false;
  statusEl.textContent = 'Fișier încărcat. Apasă „Transcrie automat (RO)”.';
};
$('srtInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  subtitleText.value = await f.text();
  $('btnApply').click();
};
$('btnDemo').onclick = () => {
  subtitleText.value = `1\n00:00:01,000 --> 00:00:03,000\nBună, acesta este un exemplu\n\n2\n00:00:03,500 --> 00:00:06,500\nPoți schimba stilul și lungimea\n`;
  $('btnApply').click();
};
$('btnDownloadSRT').onclick = () => {
  if (!cues.length) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toSRT(cues)], { type: 'text/plain;charset=utf-8' }));
  a.download = 'subtitrari_ro.srt'; a.click();
};

/* ---------- transcriere Whisper (cuvânt cu cuvânt) ---------- */
let asr = null, asrModel = null;
async function decodeAudio(file) {
  const buf = await file.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const audio = await ctx.decodeAudioData(buf);
  ctx.close();
  if (audio.numberOfChannels === 1) return audio.getChannelData(0);
  const a = audio.getChannelData(0), b = audio.getChannelData(1);
  const mono = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) mono[i] = (a[i] + b[i]) / 2;
  return mono;
}
btnTranscribe.onclick = async () => {
  if (!currentFile) return;
  btnTranscribe.disabled = true; progress.style.display = 'block'; progress.value = 0;
  try {
    const modelId = $('model').value;
    if (!asr || asrModel !== modelId) {
      statusEl.textContent = 'Se descarcă modelul Whisper (prima dată poate dura câteva minute)...';
      const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
      const files = {};
      asr = await pipeline('automatic-speech-recognition', modelId, {
        progress_callback: p => {
          if (p.status === 'progress' && p.file) {
            files[p.file] = p.progress || 0;
            const v = Object.values(files);
            progress.value = v.reduce((a, b) => a + b, 0) / v.length;
          }
        }
      });
      asrModel = modelId;
    }
    progress.removeAttribute('value');
    statusEl.textContent = 'Se extrage audio...';
    const audio = await decodeAudio(currentFile);
    statusEl.textContent = 'Se transcrie... (local, poate dura)';
    let res;
    try {
      res = await asr(audio, { language: 'romanian', task: 'transcribe', return_timestamps: 'word', chunk_length_s: 30, stride_length_s: 5 });
    } catch (e) {
      console.warn('Timpi pe cuvânt indisponibili, folosesc segmente', e);
      res = await asr(audio, { language: 'romanian', task: 'transcribe', return_timestamps: true, chunk_length_s: 30, stride_length_s: 5 });
    }
    const words = [];
    for (const c of (res.chunks || [])) {
      const t = (c.text || '').trim(); if (!t) continue;
      const s = c.timestamp[0] ?? 0, e = c.timestamp[1] ?? (s + 0.4);
      if (/\s/.test(t)) words.push(...splitWords(t, s, e)); // segment cu mai multe cuvinte
      else words.push({ w: t, s, e: Math.max(e, s + 0.1) });
    }
    if (!words.length) { statusEl.textContent = 'Nu s-a detectat vorbire.'; }
    else { baseWords = words; regroup(); statusEl.textContent = `Transcriere gata: ${cues.length} subtitrări. Ajustează „Caractere / subtitrare” sau editează textul.`; }
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Eroare la transcriere: ' + (err.message || err) + ' (verifică internetul; folosește Chrome/Edge actualizat)';
  } finally {
    progress.style.display = 'none'; btnTranscribe.disabled = false;
  }
};

/* ---------- export ---------- */
let audioCtx = null, mediaSource = null, audioDest = null;

btnExport.onclick = async () => {
  if (!video.src || !cues.length) { statusEl.textContent = 'Încarcă video + subtitrări mai întâi.'; return; }
  if (!video.videoWidth) { statusEl.textContent = 'Fișierul nu are imagine video.'; return; }
  if (exporting) return;
  exporting = true; btnExport.disabled = true;

  try { await document.fonts.load(`800 40px ${fontFamily.value}`); await document.fonts.load(`500 40px ${fontFamily.value}`); } catch {}

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mediaSource = audioCtx.createMediaElementSource(video);
    audioDest = audioCtx.createMediaStreamDestination();
    mediaSource.connect(audioCtx.destination);
    mediaSource.connect(audioDest);
  }
  await audioCtx.resume();

  const stream = canvas.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);

  video.pause(); video.currentTime = 0;
  await new Promise(r => video.addEventListener('seeked', r, { once: true }));

  let running = true;
  const fs = canvas.width * (parseFloat(fontSize.value) || 6) / 100;
  const font = `${bold.checked ? 800 : 500} ${fs}px ${fontFamily.value}`;
  const lh = fs * 1.25, padX = fs * 0.5, padY = fs * 0.25;

  function drawCue(cue, t) {
    ctx.font = font; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    const space = ctx.measureText(' ').width;
    const maxW = canvas.width * 0.88;
    const ai = activeIdx(cue, t);
    const items = cue.words.map((w, i) => { const s = disp(w.w); return { s, i, w: ctx.measureText(s).width }; });
    const lines = []; let cur = { it: [], w: 0 };
    for (const it of items) {
      const nw = cur.it.length ? cur.w + space + it.w : it.w;
      if (cur.it.length && nw > maxW) { lines.push(cur); cur = { it: [it], w: it.w }; }
      else { cur.it.push(it); cur.w = nw; }
    }
    lines.push(cur);
    const bw = Math.max(...lines.map(l => l.w));
    const bh = lines.length * lh;
    const cx = canvas.width / 2;
    const bottom = canvas.height * (1 - pos.value / 100);
    const top = bottom - bh;
    ctx.fillStyle = rgba();
    ctx.beginPath(); ctx.roundRect(cx - bw/2 - padX, top - padY, bw + padX*2, bh + padY*2, fs * 0.25); ctx.fill();
    lines.forEach((ln, li) => {
      let x = cx - ln.w / 2; const y = top + li * lh + (lh - fs) / 2;
      for (const it of ln.it) {
        if (outline.checked) { ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.16; ctx.strokeStyle = '#000'; ctx.strokeText(it.s, x, y); }
        ctx.fillStyle = (hiOn.checked && it.i === ai) ? hiColor.value : textColor.value;
        ctx.fillText(it.s, x, y);
        x += it.w + space;
      }
    });
  }

  function draw() {
    if (!running) return;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const t = video.currentTime;
    const cue = cues.find(c => t >= c.start && t <= c.end);
    if (cue && cue.words.length) drawCue(cue, t);
    requestAnimationFrame(draw);
  }

  const done = new Promise(resolve => {
    video.addEventListener('ended', () => { running = false; recorder.stop(); }, { once: true });
    recorder.onstop = resolve;
  });
  recorder.start(500);
  await video.play();
  draw();
  const tick = setInterval(() => {
    statusEl.textContent = `Export în curs: ${Math.round(video.currentTime / video.duration * 100)}% (timp real, nu închide fila)`;
  }, 500);
  await done;
  clearInterval(tick);

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
  a.download = 'video_subtitrat.webm'; a.click();
  statusEl.textContent = 'Export gata! Fișierul .webm a fost descărcat.';
  exporting = false; btnExport.disabled = false;
};

updateOverlay();
</script>
</body>
</html>
